
name: Urban Water Leak CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  backend:
    name: Spring Boot Build and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and test backend
        working-directory: backend
        run: mvn -B clean verify

  frontend:
    name: React Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React
        working-directory: frontend
        run: npm run build

  python:
    name: Python Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas numpy boto3 "psycopg[binary]"

      - name: Check Python syntax
        run: |
          python -m compileall -q analytics warehouse deployment

      - name: Run offline tests
        run: |
          python -m pytest analytics/tests/test_cloud.py warehouse/tests/test_export.py -q
