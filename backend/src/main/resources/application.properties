spring.application.name=water-leak-backend
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/water_leak_db}
spring.datasource.username=${DB_USER:wateruser}
spring.datasource.password=${DB_PASSWORD:waterpass}
spring.datasource.hikari.maximum-pool-size=8
spring.sql.init.mode=never
server.error.include-message=always
