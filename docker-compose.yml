services:
  postgres:
    image: postgres:16
    container_name: water-leak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: water_leak_db
      POSTGRES_USER: wateruser
      POSTGRES_PASSWORD: waterpass # Local development only: replace for any deployed system.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - water_leak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wateruser -d water_leak_db"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  water_leak_pgdata:
